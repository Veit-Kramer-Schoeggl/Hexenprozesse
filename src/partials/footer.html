<!-- Footer-Partial — wird per @@include('footer') eingebunden -->
<p class="druck-quelle" id="druck-quelle"></p>

<footer class="site-footer">
  <div class="container">
    <p>© Siegfried Kramer (†2020) · Inhalte mit Quellenangabe. Weitergeführt von Veit Kramer-Schöggl.</p>
    <p><a href="/pages/impressum.html">Impressum</a> · <a href="/pages/kontakt.html">Kontakt</a></p>
  </div>
</footer>
<script>
// Dropdown-Navigation Toggle
document.querySelectorAll(".nav-dropdown-toggle").forEach((toggle) => {
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const dropdown = toggle.closest(".nav-dropdown");
    const isOpen = dropdown.classList.contains("open");
    document.querySelectorAll(".nav-dropdown.open").forEach((d) => d.classList.remove("open"));
    if (!isOpen) dropdown.classList.add("open");
  });
});
document.addEventListener("click", () => {
  document.querySelectorAll(".nav-dropdown.open").forEach((d) => d.classList.remove("open"));
});

// Quellenzeile fuer den Ausdruck: Titel, Adresse und Abrufdatum. Sie ist am
// Bildschirm unsichtbar und erscheint nur auf Papier beziehungsweise im PDF,
// damit ein Ausdruck zitierfaehig bleibt.
(() => {
  const zeile = document.getElementById("druck-quelle");
  if (!zeile) return;
  const setzen = () => {
    const heute = new Date().toLocaleDateString("de-AT", {
      day: "2-digit", month: "long", year: "numeric",
    });
    const titel = document.title.replace(/\s*—\s*Hexenprozesse\s*$/, "");
    zeile.textContent =
      `${titel} · hexenprozesse.at · Forschungsarbeit von Siegfried Kramer, ` +
      `weitergeführt von Veit Kramer-Schöggl · ${location.href.split("?")[0]} · abgerufen am ${heute}`;
  };
  setzen();
  window.addEventListener("beforeprint", setzen);
})();

// Hoehe der klebenden Kopfzeile bereitstellen, damit die Kastenkoepfe
// darunter kleben statt darunter zu verschwinden.
(() => {
  const kopf = document.querySelector(".site-header");
  if (!kopf) return;
  const setzen = () =>
    document.documentElement.style.setProperty("--kopf-hoehe", kopf.offsetHeight + "px");
  setzen();
  if (window.ResizeObserver) new ResizeObserver(setzen).observe(kopf);
  window.addEventListener("resize", setzen);
})();

// Wischen auf Touch-Geraeten: nach links zum naechsten Fall, nach rechts zum
// vorherigen. Nutzt dieselben Ziele wie die Pfeile am Bildschirmrand.
(() => {
  const nav = document.querySelector("nav.fall-nav");
  if (!nav || !window.matchMedia("(pointer: coarse)").matches) return;

  const vor = nav.querySelector(".fall-nav-vor");
  const zurueck = nav.querySelector(".fall-nav-zurueck");
  if (!vor && !zurueck) return;

  const MINDEST = 80; // zurueckgelegte Strecke in px
  const STEILHEIT = 1.6; // waagrecht muss deutlich groesser sein als senkrecht
  let x0 = 0, y0 = 0, aktiv = false;

  // Innerhalb waagrecht scrollbarer Bereiche (Tabellen, Karte) nicht greifen
  const inScrollbarem = (el) => {
    for (let n = el; n && n !== document.body; n = n.parentElement) {
      if (n.classList && n.classList.contains("ortskarte")) return true;
      if (n.scrollWidth > n.clientWidth + 2) {
        const ox = getComputedStyle(n).overflowX;
        if (ox === "auto" || ox === "scroll") return true;
      }
    }
    return false;
  };

  document.addEventListener("touchstart", (e) => {
    aktiv = false;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (inScrollbarem(t.target)) return;
    x0 = t.clientX; y0 = t.clientY; aktiv = true;
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!aktiv) return;
    aktiv = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < MINDEST || Math.abs(dx) < Math.abs(dy) * STEILHEIT) return;
    const ziel = dx < 0 ? vor : zurueck;
    if (!ziel) return;
    // kurz aufleuchten lassen, damit die Richtung erkennbar bleibt
    ziel.classList.add("fall-nav-aktiv");
    setTimeout(() => { window.location.href = ziel.href; }, 120);
  }, { passive: true });
})();

// Sprachwechsel: an derselben Stelle bleiben statt an den Seitenanfang zu
// springen. Vor dem Wechsel den Anteil der Seitenhoehe merken, auf der
// Zielseite denselben Anteil wiederherstellen. Da die Uebersetzung derselbe
// Text in anderer Sprache ist, landet man so im gleichen Bereich.
(() => {
  const SCHLUESSEL = "sprachwechsel";
  document.querySelectorAll(".sprachwahl-link").forEach((a) => {
    a.addEventListener("click", () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const anteil = max > 0 ? window.scrollY / max : 0;
      try { sessionStorage.setItem(SCHLUESSEL, anteil + "|" + Date.now()); } catch (e) {}
    });
  });
  let roh = null;
  try { roh = sessionStorage.getItem(SCHLUESSEL); } catch (e) {}
  if (roh) {
    try { sessionStorage.removeItem(SCHLUESSEL); } catch (e) {}
    const [anteil, zeit] = roh.split("|");
    if (Date.now() - Number(zeit) < 5000) {
      requestAnimationFrame(() => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        window.scrollTo(0, parseFloat(anteil) * max);
      });
    }
  }
})();
</script>
