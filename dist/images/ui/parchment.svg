<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Grundton der Buchseite -->
  <rect width="320" height="320" fill="#f3e9cf"/>

  <!-- feine Faser-/Korn-Struktur (hohe Frequenz) -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.55
              0 0 0 0 0.45
              0 0 0 0 0.28
              0 0 0 0.05 0"/>
  </filter>
  <rect width="320" height="320" filter="url(#grain)"/>

  <!-- breite, wolkige Verfärbung/Flecken (niedrige Frequenz) -->
  <filter id="stain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" stitchTiles="stitch" seed="12"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.45
              0 0 0 0 0.34
              0 0 0 0 0.16
              0 0 0 0.10 0"/>
  </filter>
  <rect width="320" height="320" filter="url(#stain)"/>
</svg>
